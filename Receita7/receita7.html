<!DOCTYPE html>
<html>   
   <head>
      <meta charset="UTF-8">
      <title>Receita 7 - Usuários</title>
      <link rel="stylesheet" href="estilo.css">      
   </head>

   <body>

      <div id="botoes">
         <button id="botaoCarregar">Carregar Usuários</button>
      </div>

      <div id="tabelaDiv"></div>            

   </body>   
   
   
   <script src="tabela.js"></script>

   <script>
      let usuarios = [];

      
      const carregarUsuarios = async () => {
         try {
            let res = await fetch("https://jsonplaceholder.typicode.com/users");
            let dados = await res.json();
            
            // Pega os primeiros 5 usuários para exibição
            usuarios = dados.slice(0, 5);
            
            // Chama a função que está em tabela.js
            carregarTabela(usuarios, "tabelaDiv", ["ID", "Nome", "Usuário", "E-mail", "Telefone", "Site"], ["id", "name", "username", "email", "phone", "website"]);
            
         } catch(err) {
            document.getElementById("tabelaDiv").innerHTML = "<p>Erro ao carregar os dados...</p>";
         }
      };

      let botao = document.getElementById("botaoCarregar");
      botao.addEventListener("click", carregarUsuarios);                 
   </script>
</html>
